server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_BASE_PATH:/}

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432}/${DB_SCHEMA:arbitaja}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  properties:
    hibernate:
      format_sql: true
      show_sql: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security:
      web.authentication: DEBUG
      web.access: DEBUG
      core.Authentication: DEBUG

app:
  API_KEY: ${API_KEY:default_api_key}
  VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:http://localhost:3000}
  ADMIN_USERNAME: ${ADMIN_USERNAME:admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:admin}