server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_BASE_PATH:/}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_URL:localhost:5432}/${POSTGRES_DB:arbitaja}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      auto-commit: true
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
  properties:
    hibernate:
      format_sql: true
      show_sql: true
  liquibase:
    change-log: classpath:/db.changelog/db.changelog-master.xml
    parameters:
      adminUsername: ${ADMIN_USERNAME:admin}
      adminPasswordPlain: ${ADMIN_PASSWORD:admin}
      competitorUsername: ${COMPETITOR_USERNAME:competitor}
      competitorPasswordPlain: ${COMPETITOR_PASSWORD:123}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    disable-swagger-default-url: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security:
      web.authentication: DEBUG
      web.access: DEBUG
      core.Authentication: DEBUG

app:
  API_KEY: ${API_KEY:default_api_key}
  VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:http://localhost:3000}
  BASE_URL: ${VITE_APP_BASE_URL:http://localhost:8080}
  BASE_PATH: ${VITE_APP_API_ENDPOINT:/}
  public-apis:
    "/login,
    /login-user,
    /v1/user/signup/create,
    /v2/signup,
    /swagger-ui/**,
    /swagger/**,
    /api-docs/**,
    /v1/competition/criteria/**,
    /v1/competition/get,
    /v1/competition/all/get,
    /v1/dashboard/**,
    /health"

arbitaja:
  pam:
    mode: ${PAM_MODE:hex}
  competition:
    mode: ${COMPETITION_MODE:hex}

